<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Suggestor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }

    .app { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }
    .header { text-align: center; padding: 36px 0 24px; }
    .header h1 { font-size: 2.2rem; font-weight: 800; }
    .subtitle { color: #888; margin-top: 6px; font-size: 1rem; }
    .restaurant-banner { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; font-size: 0.85rem; color: #ccc; }
    .restaurant-banner span { font-weight: 700; color: #f97316; }
    .switch-restaurant-btn { background: none; border: 1px solid #444; color: #999; padding: 4px 10px; border-radius: 14px; cursor: pointer; font-size: 0.72rem; }
    .switch-restaurant-btn:hover { color: #fff; border-color: #666; }

    /* Restaurant picker */
    .picker-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .picker-card { background: #1a1a1a; border-radius: 20px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
    .picker-card h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .picker-card .subtitle { margin-bottom: 24px; }
    .picker-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .picker-restaurant { background: #242424; border: 1px solid #333; color: #f0f0f0; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.15s; text-align: left; }
    .picker-restaurant:hover { border-color: #f97316; background: #2a1800; }
    .picker-create { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #2a2a2a; padding-top: 20px; text-align: left; }
    .picker-create input { background: #242424; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; min-width: 0; }
    .picker-create input:focus { outline: none; border-color: #f97316; }

    .layout { display: grid; grid-template-columns: 1fr 360px; gap: 28px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; padding-bottom: 76px; } }

    /* Menu panel */
    .menu-panel { background: #1a1a1a; border-radius: 16px; padding: 24px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .panel-header h2 { font-size: 1.3rem; font-weight: 700; }
    .clear-btn { background: #2a2a2a; border: 1px solid #444; color: #ccc; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
    .clear-btn:hover { background: #333; color: #fff; }
    .category-group { margin-bottom: 28px; }
    .category-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #f97316; margin-bottom: 12px; }
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

    /* Food card */
    .food-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 10px; background: #242424; border: 2px solid transparent; border-radius: 12px; cursor: pointer; transition: all 0.15s ease; text-align: center; color: #e0e0e0; }
    .food-card:hover { background: #2c2c2c; border-color: #f97316; transform: translateY(-2px); }
    .food-card.selected { background: #2a1800; border-color: #f97316; box-shadow: 0 0 12px rgba(249,115,22,0.3); }
    .food-emoji { font-size: 1.8rem; line-height: 1; }
    .food-name { font-size: 0.72rem; font-weight: 600; line-height: 1.2; color: #ddd; }
    .check-badge { position: absolute; top: 6px; right: 8px; font-size: 0.7rem; color: #f97316; font-weight: 800; }
    .food-card.sold-out { opacity: 0.45; cursor: not-allowed; }
    .food-card.sold-out:hover { background: #242424; border-color: transparent; transform: none; }
    .sold-out-label { font-size: 0.66rem; font-weight: 700; color: #d03b3b; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Stars */
    .star-row { display: flex; align-items: center; gap: 1px; }
    .star { font-size: 0.85rem; }
    .star.full { color: #f97316; }
    .star.half { color: #f97316; opacity: 0.6; }
    .star.empty { color: #3a3a3a; }
    .star-label { font-size: 0.72rem; color: #888; margin-left: 4px; font-weight: 600; }
    .star-row.small .star { font-size: 0.65rem; }

    /* Suggestions panel */
    .suggestions-panel { position: sticky; top: 20px; background: #1a1a1a; border-radius: 16px; padding: 24px; }
    .suggestions-panel h2 { font-size: 1.1rem; font-weight: 700; }
    .suggestions-panel-header { display: flex; align-items: center; justify-content: space-between; cursor: default; }
    .suggestions-toggle-icon { display: none; }
    .suggestions-panel-body { margin-top: 18px; }
    .suggestions-list { display: flex; flex-direction: column; gap: 12px; }
    .loading-state { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0; color: #666; }
    .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #f97316; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* On mobile, suggestions live in a bottom sheet instead of below the whole
       menu — otherwise picking an item means scrolling past every category to see it. */
    @media (max-width: 900px) {
      .suggestions-panel {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -8px 28px rgba(0,0,0,0.5);
        z-index: 40;
        max-height: 50vh;
        display: flex;
        flex-direction: column;
        padding: 16px 20px 20px;
      }
      .suggestions-panel-header { cursor: pointer; flex-shrink: 0; }
      .suggestions-panel h2 { font-size: 1rem; }
      .suggestions-toggle-icon { display: inline-block; font-size: 0.9rem; color: #999; transition: transform 0.2s; }
      .suggestions-panel.collapsed .suggestions-toggle-icon { transform: rotate(180deg); }
      .suggestions-panel-body { flex: 1; min-height: 0; overflow-y: auto; }
      .suggestions-panel.collapsed .suggestions-panel-body { display: none; }
    }

    /* Suggestion card */
    .suggestion-card { display: flex; align-items: flex-start; gap: 10px; background: #242424; border-radius: 12px; padding: 12px 14px; border: 1px solid #2e2e2e; transition: border-color 0.15s; }
    .suggestion-card:hover { border-color: #f97316; }
    .suggestion-card.added { border-color: #f97316; background: #2a1800; }
    .rank { font-size: 0.7rem; color: #555; font-weight: 700; padding-top: 2px; min-width: 20px; }
    .s-emoji { font-size: 1.5rem; line-height: 1; margin-top: 2px; }
    .s-body { flex: 1; min-width: 0; }
    .s-name { font-size: 0.9rem; font-weight: 700; color: #f0f0f0; margin-bottom: 3px; }
    .s-count { font-size: 0.72rem; color: #666; margin-top: 2px; }
    .s-reason { font-size: 0.74rem; color: #aaa; margin-top: 6px; line-height: 1.4; font-style: italic; }
    .add-btn { background: #f97316; border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .add-btn:hover:not(:disabled) { background: #ea6700; }
    .add-btn:disabled { background: #3a3a3a; color: #f97316; cursor: default; }

    /* Upload panel */
    .upload-panel { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 16px 20px; margin: 0 0 24px; }
    .upload-panel-text { display: flex; flex-direction: column; gap: 2px; color: #ccc; font-size: 0.88rem; }
    .upload-panel-text strong { color: #fff; font-size: 0.95rem; }
    .upload-btn { background: #f97316; border: none; color: #fff; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 0.88rem; transition: background 0.15s; white-space: nowrap; }
    .upload-btn:hover { background: #fb8b3c; }
    .upload-btn:disabled { background: #5a4228; cursor: wait; }
    .upload-result { font-size: 0.85rem; padding: 6px 12px; border-radius: 8px; }
    .upload-result.success { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
    .upload-result.error { background: rgba(239, 68, 68, 0.12); color: #f87171; }

    /* Menu availability ("86 it") */
    .availability-panel { background: #1a1a1a; border-radius: 16px; padding: 24px; margin-top: 20px; }
    .availability-panel h2 { font-size: 1.1rem; font-weight: 700; }
    .availability-hint { font-size: 0.82rem; color: #888; margin-top: 6px; margin-bottom: 16px; }
    .availability-list { display: flex; flex-direction: column; }
    .availability-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid #242424; }
    .availability-row:last-child { border-bottom: none; }
    .availability-row.sold-out { opacity: 0.6; }
    .availability-emoji { font-size: 1.25rem; }
    .availability-name { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 600; color: #f0f0f0; }
    .availability-toggle { flex-shrink: 0; background: #242424; border: 1px solid #2f6b3a; color: #4ade80; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 0.78rem; font-weight: 700; transition: all 0.15s; }
    .availability-toggle:hover { background: #2a2a2a; }
    .availability-toggle.is-sold-out { border-color: #6b2f2f; color: #d03b3b; }
    .availability-toggle:disabled { opacity: 0.6; cursor: wait; }

    /* Staff login form */
    .login-form { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
    .login-form input { background: #242424; border: 1px solid #333; color: #fff; padding: 11px 14px; border-radius: 10px; font-size: 0.9rem; }
    .login-form input:focus { outline: none; border-color: #f97316; }
    .logout-link { background: none; border: none; color: #999; font-size: 0.78rem; text-decoration: underline; cursor: pointer; margin-top: 10px; }
    .logout-link:hover { color: #fff; }

    /* Tab bar */
    .tab-bar { display: flex; gap: 6px; background: #1a1a1a; border-radius: 14px; padding: 6px; margin-bottom: 24px; width: fit-content; }
    .tab-btn { background: transparent; border: none; color: #999; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.15s; }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { background: #f97316; color: #fff; }

    /* Trends panel */
    .trends-panel { background: #1a1a1a; border-radius: 16px; padding: 24px; margin-bottom: 28px; }
    .trends-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }
    .trends-header h2 { font-size: 1.2rem; font-weight: 700; }
    .window-tabs { display: flex; gap: 8px; }
    .window-tab { background: #242424; border: 1px solid #333; color: #aaa; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all 0.15s; }
    .window-tab:hover { color: #fff; border-color: #f97316; }
    .window-tab.active { background: #f97316; border-color: #f97316; color: #fff; }
    .trends-empty { color: #777; font-size: 0.85rem; padding: 12px 0; }

    /* Trend legend */
    .trend-legend { display: flex; gap: 20px; margin: 10px 0 18px; }
    .trend-legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.78rem; color: #999; }
    .trend-legend-swatch { width: 14px; height: 8px; border-radius: 3px; }
    .trend-legend-swatch.prev { background: rgba(249, 115, 22, 0.3); }
    .trend-legend-swatch.curr { background: #f97316; }

    /* Chart rows: overlapping bars, both anchored at left=0 so direction never flips.
       Two-line layout (name+change, then track+value) reads well at any width. */
    .trend-chart { display: flex; flex-direction: column; }
    .trend-row { display: flex; flex-direction: column; gap: 6px; padding: 12px 2px; border-bottom: 1px solid #242424; }
    .trend-row:last-child { border-bottom: none; }
    .trend-row-top { display: flex; align-items: center; gap: 10px; }
    .trend-row-bottom { display: flex; align-items: center; gap: 10px; }
    .trend-rank { font-size: 0.72rem; color: #555; font-weight: 700; flex-shrink: 0; }
    .trend-emoji { font-size: 1.25rem; flex-shrink: 0; }
    .trend-name { font-size: 0.88rem; font-weight: 600; color: #f0f0f0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trend-track { position: relative; flex: 1; height: 18px; background: #222; border-radius: 4px; overflow: hidden; }
    .trend-bar-prev { position: absolute; top: 0; left: 0; height: 100%; background: rgba(249, 115, 22, 0.3); border-radius: 4px; }
    .trend-bar-curr { position: absolute; top: 3px; left: 0; height: 12px; background: #f97316; border-radius: 3px; transition: width 0.3s; }
    .trend-value { font-size: 0.78rem; color: #999; flex-shrink: 0; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    .trend-change { font-size: 0.78rem; font-weight: 700; flex-shrink: 0; white-space: nowrap; }
    .trend-change.up { color: #0ca30c; }
    .trend-change.down { color: #d03b3b; }
    .trend-change.new { color: #898781; font-weight: 600; }

    /* Frequently-bought-together combos */
    .combo-list { display: flex; flex-direction: column; }
    .combo-row { padding: 12px 2px; border-bottom: 1px solid #242424; }
    .combo-row:last-child { border-bottom: none; }
    .combo-pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.9rem; font-weight: 600; color: #f0f0f0; }
    .combo-plus { color: #666; font-weight: 700; }
    .combo-stats { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 0.78rem; }
    .combo-count { color: #999; }
    .combo-lift { color: #0ca30c; font-weight: 700; }

    /* Mobile (QR-on-phone is the primary way customers reach this app) */
    @media (max-width: 640px) {
      .app { padding: 0 12px 28px; }
      .header { padding: 20px 0 14px; }
      .header h1 { font-size: 1.5rem; }
      .subtitle { font-size: 0.85rem; }

      .tab-bar { width: 100%; }
      .tab-btn { flex: 1; padding: 10px 6px; font-size: 0.8rem; }

      .menu-panel, .suggestions-panel, .trends-panel, .upload-panel { padding: 16px; border-radius: 14px; }
      .item-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }

      .trends-header { flex-direction: column; align-items: flex-start; }
      .window-tabs { width: 100%; }
      .window-tab { flex: 1; padding: 9px 4px; font-size: 0.74rem; text-align: center; }

      .trend-value { min-width: 52px; font-size: 0.74rem; }
      .trend-change { font-size: 0.74rem; }

      .upload-panel { flex-direction: column; align-items: stretch; text-align: center; }
      .upload-btn { width: 100%; }

      .add-btn { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function StarRating({ value, small = false }) {
      const full = Math.floor(value);
      const half = (value - full) >= 0.3 && (value - full) < 0.8;
      const empty = 5 - full - (half ? 1 : 0);
      return (
        <div className={`star-row ${small ? "small" : ""}`}>
          {Array(full).fill(null).map((_, i) => <span key={`f${i}`} className="star full">★</span>)}
          {half && <span className="star half">★</span>}
          {Array(empty).fill(null).map((_, i) => <span key={`e${i}`} className="star empty">★</span>)}
          {!small && <span className="star-label">{value.toFixed(1)}</span>}
        </div>
      );
    }

    function FoodCard({ item, selected, onToggle }) {
      const soldOut = item.sold_out;
      return (
        <button
          className={`food-card ${selected ? "selected" : ""} ${soldOut ? "sold-out" : ""}`}
          onClick={soldOut ? undefined : onToggle}
          disabled={soldOut}
          title={soldOut ? `${item.name} — sold out` : `${item.name} — ${item.purchase_count} orders`}
        >
          <span className="food-emoji">{item.emoji}</span>
          <span className="food-name">{item.name}</span>
          {soldOut ? <span className="sold-out-label">Sold Out</span> : <StarRating value={item.stars} small />}
          {selected && <span className="check-badge">✓</span>}
        </button>
      );
    }

    function SuggestionCard({ item, rank, onAdd, alreadySelected }) {
      return (
        <div className={`suggestion-card ${alreadySelected ? "added" : ""}`}>
          <div className="rank">#{rank}</div>
          <div className="s-emoji">{item.emoji}</div>
          <div className="s-body">
            <div className="s-name">{item.name}</div>
            <StarRating value={item.stars} />
            <div className="s-count">{item.purchase_count} orders</div>
            {item.reason && <p className="s-reason">✦ {item.reason}</p>}
          </div>
          <button className="add-btn" onClick={onAdd} disabled={alreadySelected} title={alreadySelected ? "Already selected" : "Add"}>
            {alreadySelected ? "✓" : "+"}
          </button>
        </div>
      );
    }

    function UploadPanel({ slug, token, onUploaded, onAuthError }) {
      const fileInputRef = React.useRef(null);
      const [status, setStatus] = useState("idle");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");

      const handleFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setStatus("uploading");
        setError("");

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch(`/api/${slug}/upload-orders`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });
          if (res.status === 401) { onAuthError && onAuthError(); return; }
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Upload failed");
          setResult(data);
          setStatus("done");
          onUploaded && onUploaded();
        } catch (err) {
          setError(err.message);
          setStatus("error");
        } finally {
          e.target.value = "";
        }
      };

      return (
        <div className="upload-panel">
          <div className="upload-panel-text">
            <strong>Have your own order history?</strong>
            <span>Upload an Excel sheet to generate suggestions from real data.</span>
          </div>
          <button className="upload-btn" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={status === "uploading"}>
            {status === "uploading" ? "Uploading…" : "Upload Orders Sheet"}
          </button>
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={handleFileChange} hidden />
          {status === "done" && result && (
            <div className="upload-result success">
              Loaded {result.distinct_orders ?? "?"} orders · {result.distinct_items} items · {result.rows} line items parsed
            </div>
          )}
          {status === "error" && <div className="upload-result error">{error}</div>}
        </div>
      );
    }

    function MenuAvailability({ slug, token, items, onChanged, onAuthError }) {
      const [busyName, setBusyName] = useState(null);

      const toggle = async (item) => {
        setBusyName(item.name);
        try {
          const res = await fetch(`/api/${slug}/sold-out`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ item_name: item.name, sold_out: !item.sold_out }),
          });
          if (res.status === 401) { onAuthError && onAuthError(); return; }
          await onChanged();
        } finally {
          setBusyName(null);
        }
      };

      if (!items.length) return null;

      return (
        <div className="availability-panel">
          <h2>🍽️ Menu Availability</h2>
          <p className="availability-hint">Mark an item sold out so customers won't see it as an option — toggle it back the moment it's available again.</p>
          <div className="availability-list">
            {items.map(item => (
              <div key={item.id} className={`availability-row ${item.sold_out ? "sold-out" : ""}`}>
                <span className="availability-emoji">{item.emoji}</span>
                <span className="availability-name">{item.name}</span>
                <button
                  className={`availability-toggle ${item.sold_out ? "is-sold-out" : ""}`}
                  onClick={() => toggle(item)}
                  disabled={busyName === item.name}
                >
                  {item.sold_out ? "Sold Out" : "Available"}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LoginForm({ slug, onLoggedIn }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setBusy(true);
        setError("");
        try {
          const res = await fetch(`/api/${slug}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Login failed");
          onLoggedIn(data.token);
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="availability-panel">
          <h2>🔒 Staff Login</h2>
          <p className="availability-hint">Log in to upload orders or manage menu availability for this restaurant.</p>
          <form className="login-form" onSubmit={submit}>
            <input
              type="text"
              placeholder="Username"
              value={username}
              onChange={e => setUsername(e.target.value)}
              autoComplete="username"
            />
            <input
              type="password"
              placeholder="Password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              autoComplete="current-password"
            />
            <button className="upload-btn" type="submit" disabled={busy || !username || !password}>
              {busy ? "Logging in…" : "Log In"}
            </button>
          </form>
          {error && <div className="upload-result error">{error}</div>}
        </div>
      );
    }

    const WINDOW_LABELS = { week: "This Week", month: "This Month", "6months": "Last 6 Months" };

    function formatChange(item) {
      if (item.change_pct == null) return { label: "New", cls: "new" };
      // Past +100% (more than doubled), a raw percentage reads as a huge,
      // confusing number — "7.7× more" says the same thing more plainly.
      if (item.change_pct > 100) {
        const multiplier = item.order_count / item.previous_count;
        const rounded = Math.round(multiplier * 10) / 10;
        const m = rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1);
        return { label: `▲ ${m}× more`, cls: "up" };
      }
      const arrow = item.change_pct > 0 ? "▲" : item.change_pct < 0 ? "▼" : "–";
      return { label: `${arrow} ${Math.abs(item.change_pct)}%`, cls: item.change_pct >= 0 ? "up" : "down" };
    }

    function TrendsPanel({ slug }) {
      const [window_, setWindow] = useState("month");
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        setLoading(true);
        fetch(`/api/${slug}/trends?window=${window_}&top_n=8`)
          .then(r => r.json())
          .then(data => { setItems(data.items || []); })
          .finally(() => setLoading(false));
      }, [window_, slug]);

      const maxValue = Math.max(
        1,
        ...items.map(i => Math.max(i.order_count, i.previous_count))
      );

      return (
        <div className="trends-panel">
          <div className="trends-header">
            <h2>📈 Trending Items</h2>
            <div className="window-tabs">
              {Object.keys(WINDOW_LABELS).map(w => (
                <button
                  key={w}
                  className={`window-tab ${window_ === w ? "active" : ""}`}
                  onClick={() => setWindow(w)}
                >
                  {WINDOW_LABELS[w]}
                </button>
              ))}
            </div>
          </div>

          {!loading && items.length > 0 && (
            <div className="trend-legend">
              <span className="trend-legend-item"><span className="trend-legend-swatch prev" /> Previous period</span>
              <span className="trend-legend-item"><span className="trend-legend-swatch curr" /> {WINDOW_LABELS[window_]}</span>
            </div>
          )}

          {loading ? (
            <div className="trends-empty">Loading trends…</div>
          ) : items.length === 0 ? (
            <div className="trends-empty">No orders in this period yet.</div>
          ) : (
            <div className="trend-chart">
              {items.map((item, i) => {
                const currPct = (item.order_count / maxValue) * 100;
                const prevPct = (item.previous_count / maxValue) * 100;
                const { label: changeLabel, cls: changeClass } = formatChange(item);

                return (
                  <div key={item.id} className="trend-row">
                    <div className="trend-row-top">
                      <span className="trend-rank">#{i + 1}</span>
                      <span className="trend-emoji">{item.emoji}</span>
                      <span className="trend-name" title={item.name}>{item.name}</span>
                      <span className={`trend-change ${changeClass}`}>{changeLabel}</span>
                    </div>
                    <div className="trend-row-bottom">
                      <div className="trend-track">
                        <div className="trend-bar-prev" style={{ width: `${prevPct}%` }} />
                        <div className="trend-bar-curr" style={{ width: `${currPct}%` }} />
                      </div>
                      <span className="trend-value">{item.order_count} orders</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function CombosPanel({ slug, refreshKey }) {
      const [combos, setCombos] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        setLoading(true);
        fetch(`/api/${slug}/combos?top_n=8`)
          .then(r => r.json())
          .then(data => setCombos(data.combos || []))
          .finally(() => setLoading(false));
      }, [refreshKey, slug]);

      return (
        <div className="trends-panel">
          <div className="trends-header">
            <h2>🧩 Frequently Bought Together</h2>
          </div>
          <p className="availability-hint">Real pairs from the same order — turn these into combo-meal promos.</p>

          {loading ? (
            <div className="trends-empty">Loading combos…</div>
          ) : combos.length === 0 ? (
            <div className="trends-empty">Not enough order history yet to find reliable pairs.</div>
          ) : (
            <div className="combo-list">
              {combos.map((c, i) => (
                <div key={i} className="combo-row">
                  <div className="combo-pair">
                    <span className="combo-item">{c.item_a.emoji} {c.item_a.name}</span>
                    <span className="combo-plus">+</span>
                    <span className="combo-item">{c.item_b.emoji} {c.item_b.name}</span>
                  </div>
                  <div className="combo-stats">
                    <span className="combo-count">{c.together_count} orders together</span>
                    {c.lift > 1 && <span className="combo-lift">{c.lift}× more likely paired</span>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function App({ restaurant, onSwitchRestaurant }) {
      const slug = restaurant.slug;
      const [allItems, setAllItems] = useState([]);
      const [selectedIds, setSelectedIds] = useState([]);
      const [suggestions, setSuggestions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [initialLoad, setInitialLoad] = useState(true);
      const [uploadVersion, setUploadVersion] = useState(0);
      const [activeTab, setActiveTab] = useState("trends");
      const [suggestionsCollapsed, setSuggestionsCollapsed] = useState(true);
      const [authToken, setAuthToken] = useState(() => sessionStorage.getItem(`auth:${slug}`));

      useEffect(() => {
        setAuthToken(sessionStorage.getItem(`auth:${slug}`));
      }, [slug]);

      const handleLoggedIn = (token) => {
        sessionStorage.setItem(`auth:${slug}`, token);
        setAuthToken(token);
      };

      const handleAuthError = () => {
        sessionStorage.removeItem(`auth:${slug}`);
        setAuthToken(null);
      };

      const loadItems = useCallback(() => {
        return fetch(`/api/${slug}/items`).then(r => r.json()).then(data => { setAllItems(data); });
      }, [slug]);

      useEffect(() => {
        loadItems().then(() => setInitialLoad(false));
      }, [loadItems]);

      const fetchSuggestions = useCallback(async (ids) => {
        setLoading(true);
        try {
          const res = await fetch(`/api/${slug}/suggest`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selected_item_ids: ids, top_n: 6 }),
          });
          const data = await res.json();
          setSuggestions(data.suggestions);
        } finally {
          setLoading(false);
        }
      }, [slug]);

      const toggleItem = (id) => {
        const isAdding = !selectedIds.includes(id);
        const next = isAdding ? [...selectedIds, id] : selectedIds.filter(x => x !== id);
        setSelectedIds(next);
        fetchSuggestions(next);
        setSuggestionsCollapsed(isAdding ? false : next.length === 0);
      };

      const clearSelection = () => { setSelectedIds([]); fetchSuggestions([]); setSuggestionsCollapsed(true); };

      const handleUploaded = useCallback(() => {
        setSelectedIds([]);
        setUploadVersion(v => v + 1);
        loadItems().then(() => fetchSuggestions([]));
      }, [loadItems, fetchSuggestions]);

      useEffect(() => { if (!initialLoad) fetchSuggestions([]); }, [initialLoad]);

      const categories = [...new Set(allItems.map(i => i.category))];

      const TABS = [
        { key: "trends", label: "📈 Trends" },
        { key: "order", label: "🍽️ Order" },
        { key: "upload", label: "📤 Upload Data" },
      ];

      return (
        <div className="app">
          <header className="header">
            <h1>🍽️ Food Suggestor</h1>
            <p className="subtitle">Select items you like — we'll suggest what pairs best</p>
            <div className="restaurant-banner">
              <span>{restaurant.name}</span>
              <button className="switch-restaurant-btn" onClick={onSwitchRestaurant}>Switch restaurant</button>
            </div>
          </header>

          <div className="tab-bar">
            {TABS.map(t => (
              <button
                key={t.key}
                className={`tab-btn ${activeTab === t.key ? "active" : ""}`}
                onClick={() => setActiveTab(t.key)}
              >
                {t.label}
              </button>
            ))}
          </div>

          {activeTab === "trends" && (
            <>
              <TrendsPanel key={uploadVersion} slug={slug} />
              <CombosPanel refreshKey={uploadVersion} slug={slug} />
            </>
          )}

          {activeTab === "upload" && (
            authToken ? (
              <>
                <UploadPanel slug={slug} token={authToken} onUploaded={handleUploaded} onAuthError={handleAuthError} />
                <MenuAvailability slug={slug} token={authToken} items={allItems} onChanged={loadItems} onAuthError={handleAuthError} />
                <button className="logout-link" onClick={handleAuthError}>Log out of {restaurant.name}</button>
              </>
            ) : (
              <LoginForm slug={slug} onLoggedIn={handleLoggedIn} />
            )
          )}

          {activeTab === "order" && (
            <div className="layout">
              <section className="menu-panel">
                <div className="panel-header">
                  <h2>Our Menu</h2>
                  {selectedIds.length > 0 && <button className="clear-btn" onClick={clearSelection}>Clear ({selectedIds.length})</button>}
                </div>
                {categories.map(cat => (
                  <div key={cat} className="category-group">
                    <h3 className="category-label">{cat}</h3>
                    <div className="item-grid">
                      {allItems.filter(i => i.category === cat).map(item => (
                        <FoodCard key={item.id} item={item} selected={selectedIds.includes(item.id)} onToggle={() => toggleItem(item.id)} />
                      ))}
                    </div>
                  </div>
                ))}
              </section>

              <section className={`suggestions-panel ${suggestionsCollapsed ? "collapsed" : ""}`}>
                <div className="suggestions-panel-header" onClick={() => setSuggestionsCollapsed(c => !c)}>
                  <h2>{selectedIds.length === 0 ? "🔥 Popular Right Now" : "✨ Suggested For You"}</h2>
                  <span className="suggestions-toggle-icon">▾</span>
                </div>
                <div className="suggestions-panel-body">
                  {loading ? (
                    <div className="loading-state"><div className="spinner" /><p>Finding the best pairings…</p></div>
                  ) : (
                    <div className="suggestions-list">
                      {suggestions.map((s, i) => (
                        <SuggestionCard key={s.id} item={s} rank={i + 1} onAdd={() => toggleItem(s.id)} alreadySelected={selectedIds.includes(s.id)} />
                      ))}
                    </div>
                  )}
                </div>
              </section>
            </div>
          )}
        </div>
      );
    }

    function RestaurantPicker({ onSelect }) {
      const [restaurants, setRestaurants] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newName, setNewName] = useState("");
      const [newUsername, setNewUsername] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [creating, setCreating] = useState(false);
      const [error, setError] = useState("");

      useEffect(() => {
        fetch("/api/restaurants")
          .then(r => r.json())
          .then(data => setRestaurants(data))
          .finally(() => setLoading(false));
      }, []);

      const canCreate = newName.trim() && newUsername.trim() && newPassword;

      const createAndSelect = async () => {
        if (!canCreate) return;
        setCreating(true);
        setError("");
        try {
          const res = await fetch("/api/restaurants", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: newName.trim(), username: newUsername.trim(), password: newPassword }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Could not create restaurant");
          onSelect(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setCreating(false);
        }
      };

      return (
        <div className="picker-screen">
          <div className="picker-card">
            <h1>🍽️ Food Suggestor</h1>
            <p className="subtitle">Choose a restaurant to view</p>

            {loading ? (
              <div className="trends-empty">Loading…</div>
            ) : (
              <div className="picker-list">
                {restaurants.map(r => (
                  <button key={r.slug} className="picker-restaurant" onClick={() => onSelect(r)}>
                    {r.name}
                  </button>
                ))}
              </div>
            )}

            <div className="picker-create">
              <p className="availability-hint">New restaurant — sets its staff login too</p>
              <input
                type="text"
                placeholder="Restaurant name"
                value={newName}
                onChange={e => setNewName(e.target.value)}
              />
              <input
                type="text"
                placeholder="Staff username"
                value={newUsername}
                onChange={e => setNewUsername(e.target.value)}
                autoComplete="username"
              />
              <input
                type="password"
                placeholder="Staff password"
                value={newPassword}
                onChange={e => setNewPassword(e.target.value)}
                autoComplete="new-password"
                onKeyDown={e => e.key === "Enter" && createAndSelect()}
              />
              <button className="upload-btn" onClick={createAndSelect} disabled={creating || !canCreate}>
                {creating ? "Creating…" : "+ Add Restaurant"}
              </button>
              {error && <div className="upload-result error">{error}</div>}
            </div>
          </div>
        </div>
      );
    }

    function Root() {
      const [restaurant, setRestaurant] = useState(null);
      const [checked, setChecked] = useState(false);

      useEffect(() => {
        const slug = new URLSearchParams(window.location.search).get("r");
        if (!slug) { setChecked(true); return; }
        fetch("/api/restaurants")
          .then(r => r.json())
          .then(list => {
            const match = list.find(r => r.slug === slug);
            if (match) setRestaurant(match);
          })
          .finally(() => setChecked(true));
      }, []);

      const selectRestaurant = (r) => {
        setRestaurant(r);
        const url = new URL(window.location.href);
        url.searchParams.set("r", r.slug);
        window.history.pushState({}, "", url);
      };

      const switchRestaurant = () => {
        setRestaurant(null);
        const url = new URL(window.location.href);
        url.searchParams.delete("r");
        window.history.pushState({}, "", url);
      };

      if (!checked) return null;
      if (!restaurant) return <RestaurantPicker onSelect={selectRestaurant} />;
      return <App restaurant={restaurant} onSwitchRestaurant={switchRestaurant} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
